server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: pharmapredict-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pharmapredict}
    username: ${SPRING_DATASOURCE_USERNAME:pharmapredict}
    password: ${SPRING_DATASOURCE_PASSWORD:pharmapredict}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

app:
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: PharmaPredict AI API
    description: Pharmacy inventory and medicine demand forecasting backend